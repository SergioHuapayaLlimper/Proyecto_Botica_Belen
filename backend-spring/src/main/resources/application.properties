# ============================================================
#  Botica Belén - API Spring Boot
#  Cada valor puede sobrescribirse con una variable de entorno (DB_PORT, DB_PASS, ...).
# ============================================================
spring.application.name=botica-belen-api
server.port=${PORT:3200}

# --- MySQL (por defecto, el contenedor de docker-compose.yml en el puerto 3307) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:botica_belen_db}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# --- JPA / Hibernate ---
# La estructura la crean los scripts de /database: Hibernate no toca las tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Respeta los nombres tal cual (idUsuario, passwordHash...) en lugar de convertirlos a id_usuario.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false

# --- JWT ---
# Cambia esta clave (mínimo 32 caracteres). Puedes definirla con la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:botica-belen-clave-de-desarrollo-cambiala-por-una-larga-y-aleatoria}
app.jwt.horas=8

# --- CORS: orígenes del frontend Angular ---
app.cors.origins=${CORS_ORIGIN:http://localhost:4200,http://localhost:4300}

# --- Varios ---
spring.main.banner-mode=off
spring.web.resources.add-mappings=false
spring.jackson.time-zone=America/Lima
logging.level.root=WARN
logging.level.pe.upn.boticabelen=INFO
logging.level.peticiones=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# Log también en archivo (para revisar errores de arranque)
logging.file.name=logs/api.log
